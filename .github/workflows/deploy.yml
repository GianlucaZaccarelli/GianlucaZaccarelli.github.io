name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Ogni lunedì: ricostruisce il sito con il calendario GitHub aggiornato
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      # E2E disattivati: gli snapshot visuali sono generati su Windows e non
      # combaciano col rendering Linux del runner. Per riattivarli servono
      # `npx playwright install --with-deps chromium` + `npm run test:e2e`
      # e snapshot rigenerati su Linux.

      # Calendario delle contribuzioni per la sezione Competenze; se GitHub non
      # risponde lo script lascia il file versionato e la build prosegue
      - name: Fetch GitHub activity
        run: node scripts/fetch-github-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with Astro
        run: npm run build

      - name: Generate CV PDF
        run: node scripts/generate-pdf.mjs

      - name: Copy CVs to dist
        run: cp public/cv.pdf public/cv-en.pdf dist/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
